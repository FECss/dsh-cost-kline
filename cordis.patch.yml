# dsh-cost-kline 的 bundle 层：插入 Host 插件行 + 浏览器半侧插槽。
# prices 是「每 100 万 token 的人民币单价」，按模型名匹配（子串），改这里即可换价。
- insert:
    - id: dsh-cost-kline
      name: dsh-cost-kline
      config:
        currency: CNY
        keepDays: 30
        prices:
          default:
            cacheHit: 0.2
            cacheMiss: 2
            cacheWrite: 2
            output: 3
